<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro Modded</title>

  <!-- Load custom style sheet -->
  <link rel="stylesheet" type="text/css" href="theme/love.css">

  <script src="consolewrapper.js?v=bridge-2"></script>
  <script src="jszip.min.js"></script>
  <script src="../balatro-seed-clipboard.js?v=1"></script>
  <script src="web-mod-runtime.js?v=runtime-25"></script>
  <script src="mod-manager-ui.js?v=1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-PXHK7Q7G3Z");
  </script>
</head>

<body>
  <div id="gameContainer">
    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
</div>

  <script type='text/javascript'>
    window.callad = () => {
      window.parent.postMessage({
        type: 'adcall'
      }, '*');
    }

    function resizeCanvases() {
      var canvas = document.getElementById("canvas");
      if (canvas) {
        canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      }

      var loadingCanvas = document.getElementById("loadingCanvas");
      if (loadingCanvas) {
        loadingCanvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        loadingCanvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      }
    }

    resizeCanvases();

    function goFullScreen() {
      var canvas = document.getElementById("canvas");
      if (canvas.requestFullScreen)
        canvas.requestFullScreen();
      else if (canvas.webkitRequestFullScreen)
        canvas.webkitRequestFullScreen();
      else if (canvas.mozRequestFullScreen)
        canvas.mozRequestFullScreen();
    }

    function FullScreenHook() {
      var canvas = document.getElementById("canvas");
      canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    }

    window.addEventListener("resize", FullScreenHook, false);
    window.addEventListener("orientationchange", FullScreenHook, false);

    var loadingContext = document.getElementById('loadingCanvas').getContext('2d');

    function drawLoadingText(text) {
      var canvas = loadingContext.canvas;

      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(0, 0, canvas.width, canvas.height);

      loadingContext.font = '2em arial';
      loadingContext.textAlign = 'center';
      loadingContext.fillStyle = "rgb(11, 86, 117)";
      loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    window.onload = function() {
      window.focus();
      resizeCanvases();
    };
    window.onclick = function() {
      window.focus();
    };

    window.addEventListener("keydown", function(e) {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
    }, false);

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: (function() {
        var canvas = document.getElementById('canvas');

        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);

        return canvas;
      })(),
      setStatus: function(text) {
        if (text) {
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          document.getElementById('loadingCanvas').style.display = 'none';
          document.getElementById('canvas').style.visibility = 'visible';
          resizeCanvases();
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };

    Module.setStatus('Downloading...');
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    var applicationLoad = function(e) {
      Love(Module);
    }

    function loadScript(src, async) {
      var script = document.createElement("script");
      script.type = "text/javascript";
      script.src = src;
      script.async = !!async;
      document.head.appendChild(script);
      return script;
    }

    function bootGame() {
      loadScript("game.js?v=smods-1814a-web-v44", false);
      var loveScript = loadScript("love.js?v=fs-bridge-v1", true);
      loveScript.onload = function() {
        applicationLoad(loveScript);
      };
    }

    if (window.BalatroModManagerUI) {
      Module.setStatus("Waiting for mod selection\u2026");
      window.BalatroModManagerUI.open(function() {
        Module.setStatus("Downloading...");
        bootGame();
      });
    } else {
      bootGame();
    }
  </script>
</body>

</html>
